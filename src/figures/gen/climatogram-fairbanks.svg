<svg viewBox="0 0 720 430" role="img" aria-labelledby="fairbanks-t fairbanks-d" class="dg climatogram"><title id="fairbanks-t">Climatogram of Fairbanks, Alaska (boreal forest), 1991–2020 normals</title><desc id="fairbanks-d">Monthly mean temperature line with a shaded band from average daily low to high, and monthly precipitation bars. Mean temperature is below freezing from October through March, bottoming at about minus 22 degrees C in January, and peaks at about 17 degrees C in July. Precipitation is low all year, 8 to 57 millimeters per month, with a summer maximum in July and August. A shaded band marks the median freeze-free season from mid-May to mid-September.</desc><rect class="season" x="279" y="34" width="196" height="304"/><text class="lbl-sm lbl-a" x="377" y="26" text-anchor="middle">Median freeze-free season: 121 days</text><g class="grid"><line x1="64" x2="650" y1="338" y2="338"/><line x1="64" x2="650" y1="287.3" y2="287.3"/><line x1="64" x2="650" y1="236.7" y2="236.7"/><line x1="64" x2="650" y1="186" y2="186"/><line x1="64" x2="650" y1="135.3" y2="135.3"/><line x1="64" x2="650" y1="84.7" y2="84.7"/><line x1="64" x2="650" y1="34" y2="34"/></g><line class="zero" x1="64" x2="650" y1="186" y2="186"/><g class="axis"><text x="56" y="342" text-anchor="end">−30°C</text><text x="56" y="354" text-anchor="end" class="lbl-sm" style="font-size:10px">−22°F</text><text x="56" y="291.3" text-anchor="end">−20°C</text><text x="56" y="303.3" text-anchor="end" class="lbl-sm" style="font-size:10px">−4°F</text><text x="56" y="240.7" text-anchor="end">−10°C</text><text x="56" y="252.7" text-anchor="end" class="lbl-sm" style="font-size:10px">14°F</text><text x="56" y="190" text-anchor="end">0°C</text><text x="56" y="202" text-anchor="end" class="lbl-sm" style="font-size:10px">32°F</text><text x="56" y="139.3" text-anchor="end">10°C</text><text x="56" y="151.3" text-anchor="end" class="lbl-sm" style="font-size:10px">50°F</text><text x="56" y="88.7" text-anchor="end">20°C</te