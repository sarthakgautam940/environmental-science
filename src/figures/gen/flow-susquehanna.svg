<svg viewBox="0 0 720 360" role="img" aria-labelledby="flow-t flow-d" class="dg flowchart"><title id="flow-t">Average monthly flow of the Susquehanna River into Chesapeake Bay</title><desc id="flow-d">Bar chart of mean monthly discharge at Conowingo, Maryland, 1967 to 2025. Flow is highest in March and April, about 72,000 to 74,000 cubic feet per second, and lowest in August, about 17,000 cubic feet per second, roughly a fourfold seasonal swing.</desc><g class="grid"><line x1="70" x2="696" y1="312" y2="312"/><line x1="70" x2="696" y1="243" y2="243"/><line x1="70" x2="696" y1="174" y2="174"/><line x1="70" x2="696" y1="105" y2="105"/><line x1="70" x2="696" y1="36" y2="36"/></g><g class="axis"><text x="62" y="316" text-anchor="end">0</text><text x="62" y="328" text-anchor="end" style="font-size:10px"></text><text x="62" y="247" text-anchor="end">20k cfs</text><text x="62" y="259" text-anchor="end" style="font-size:10px">566 m³/s</text><text x="62" y="178" text-anchor="end">40k cfs</text><text x="62" y="190" text-anchor="end" style="font-size:10px">1,133 m³/s</text><text x="62" y="109" text-anchor="end">60k cfs</text><text x="62" y="121" text-anchor="end" style="font-size:10px">1,699 m³/s</text><text x="62" y="40" text-anchor="end">80k cfs</text><text x="62" y="52" text-anchor="end" style="font-size:10px">2,265 m³/s</text><text x="96.1" y="330" text-anchor="middle">Jan</text><text x="148.3" y="330" text-anchor="middle">Feb</text><text x="200.4" y="330" text-anchor="middle">Mar</text><text x="252.6" y="330" text-anchor="middle">Apr</text><text x="304.7" y="330" text-anchor="middle">May</text><text x="356.9" y="330" text-anchor="middle">Jun</text><text x="409.1" y="330" text-anchor="middle">Jul</text><text x="461.2" y="330" text-anchor="middle">Aug</text><text x="513.4" y="330" text-anchor="middle">Sep</text><text x="565.6" y="330" text-anchor="middle">Oct</text><text x="617.8" y="330" text-anchor="middle">Nov</text><text x="669.9" y="330" text-anchor="middle">Dec</text><line x1="70" x2="696" y1="312" y2="312"/></g><rect class="bar" x="78.3" y="152" width="35.5" height="160"/><rect class="hit" role="img" x="70" y="36" width="52.2" height="276" tabindex="0" data-tip="&lt;b&gt;January&lt;/b&gt;&lt;br&gt;46,387 cubic feet per second&lt;br&gt;1,314 m³/s (mean of 58 years)" aria-label="January: 46387 cubic feet per second"/><rect class="bar" x="130.5" y="140.9" width="35.5" height="171.1"/><rect class="hit" role="img" x="122.2" y="36" width="52.2" height="276" tabindex="0" data-tip="&lt;b&gt;February&lt;/b&gt;&lt;br&gt;49,602 cubic feet per second&lt;br&gt;1,405 m³/s (mean of 58 years)" aria-label="February: 49602 cubic feet per second"/><rect class="bar bar--hi" x="182.7" y="64.3" width="35.5" height="247.7"/><rect class="hit" role="img" x="174.3" y="36" width="52.2" height="276" tabindex="0" data-tip="&lt;b&gt;March&lt;/b&gt;&lt;br&gt;71,797 cubic feet per second&lt;br&gt;2,033 m³/s (mean of 58 years)" aria-label="March: 71797 cubic feet per second"/><rect class="bar bar--hi" x="234.8" y="55.4" width="35.5" height="256.6"/><rect class="hit" role="img" x="226.5" y="36" width="52.2" height="276" tabindex="0" data-tip="&lt;b&gt;April&lt;/b&gt;&lt;br&gt;74,389 cubic feet per second&lt;br&gt;2,106 m³/s (mean of 58 years)" aria-label="April: 74389 cubic feet per second"/><rect class="bar" x="287" y="140.1" width="35.5" height="171.9"/><rect class="hit" role="img" x="278.7" y="36" width="52.2" height="276" tabindex="0" data-tip="&lt;b&gt;May&lt;/b&gt;&lt;br&gt;49,837 cubic feet per second&lt;br&gt;1,411 m³/s (mean of 58 years)" aria-label="May: 49837 cubic feet per second"/><rect class="bar" x="339.2" y="196.7" width="35.5" height="115.3"/><rect class="hit" role="img" x="330.8" y="36" width="52.2" height="276" tabindex="0" data-tip="&lt;b&gt;June&lt;/b&gt;&lt;br&gt;33,427 cubic feet per second&lt;br&gt;947 m³/s (mean of 58 years)" aria-label="June: 33427 cubic feet per second"/><rect class="bar" x="391.3" y="239.4" width="35.5" height="72.6"/