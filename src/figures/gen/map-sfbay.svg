<title id="map-sfbay-t">San Francisco Bay</title>
<desc id="map-sfbay-d">Map of San Francisco Bay. Fresh water from the Sacramento and San Joaquin Rivers flows through the Delta, Suisun Bay and San Pablo Bay to the Central Bay and out through the Golden Gate to the Pacific Ocean. The South Bay extends southeast and receives little river inflow.</desc>
