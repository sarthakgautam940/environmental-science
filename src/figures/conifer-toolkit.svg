<svg viewBox="0 0 780 360" role="img" aria-labelledby="dg-tk-t dg-tk-d" class="dg">
<title id="dg-tk-t">Conifer winter toolkit: needle anatomy and crown shape</title>
<desc id="dg-tk-d">Left: cross-section of a conifer needle showing a thick waxy cuticle, stomata sunken in pits on the surface, a resin canal and a central vascular bundle of narrow tracheids, inside a small compact leaf. Right: a cone-shaped conifer with a single leader and downward-sloping flexible branches shedding snow, beside a broad-crowned tree whose flat crown collects a heavy snow load.</desc>
<defs><marker id="ah-tk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" class="f-ink"/></marker></defs>
<text class="lbl lbl-b lbl-lg lbl-serif" x="20" y="28">Needle cross-section</text>
<g transform="translate(190,190)">
  <path d="M-150,0 C-120,-70 120,-70 150,0 C120,70 -120,70 -150,0 Z" fill="#cfd9c6" stroke="#5e7a5a" stroke-width="7"/>
  <path d="M-150,0 C-120,-70 120,-70 150,0 C120,70 -120,70 -150,0 Z" class="f-a3" opacity="0.35"/>
  <ellipse cx="0" cy="4" rx="42" ry="26" fill="#f2efe6" stroke="#4f5d4c"/>
  <g fill="#8aa07f"><circle cx="-14" cy="-2" r="5"/><circle cx="0" cy="-4" r="5"/><circle cx="14" cy="-2" r="5"/><circle cx="-8" cy="10" r="5"/><circle cx="8" cy="10" r="5"/></g>
  <circle cx="-88" cy="-6" r="10" fill="#e9c46a" stroke="#9b7a2a"/>
  <circle cx="88" cy="-6" r="10" fill="#e9c46a" stroke="#9b7a2a"/>
  <g fill="#f6f3ec" stroke="#4f5d4c"><path d="M-60,-49 l6,14 l6,-14 z"/><path d="M-20,-55 l6,14 l6,-14 z"/><path d="M24,-55 l6,14 l6,-14 z"/><path d="M-40,52 l6,-14 l6,14 z"/><path d="M20,53 l6,-14 l6,14 z"/></g>
  <path d="M-54,-60 L-90,-110" class="ln-thin"/><text class="lbl lbl-b" x="-150" y="-114">Sunken stomata</text><text class="lbl-sm lbl-mute" x="-150" y="-100">pores sit in pits, out of the wind</text>
  <path d="M120,-30 L150,-104" class="ln-thin"/><text class="lbl lbl-b" x="95" y="-118">Thick waxy cuticle</text><text class="lbl-sm lbl-mute" x="95" y="-104">slows water loss</text>
  <path d="M88,6 L150,96" class="ln-thin"/><text class="lbl lbl-b" x="110" y="112">Resin canal</text>
  <path d="M0,30 L-40,104" class="ln-thin"/><text class="lbl lbl-b" x="-150" y="112">Vascular bundle</text><text class="lbl-sm lbl-mute" x="-150" y="126">narrow tracheids resist freeze–thaw air bubbles</text>
</g>
<text class="lbl-sm lbl-mute" x="40" y="352">Small, thick, compact: little surface area to lose water or catch snow</text>
<line x1="420" y1="20" x2="420" y2="340" class="ln-dash"/>
<text class="lbl lbl-b lbl-lg lbl-serif" x="440" y="28">Crown shape and snow</text>
<g transform="translate(540,60)">
  <path d="M0,0 L-14,40 L-6,40 L-30,90 L-14,90 L-46,150 L-24,150 L-62,220 L62,220 L24,150 L46,150 L14,90 L30,90 L6,40 L14,40 Z" class="f-a2"/>
  <rect x="-7" y="220" width="14" height="30" class="f-earth"/>
  <g class="f-snow" stroke="#b9c3c6"><path d="M-14,40 l-10,6 l4,-10 z"/><path d="M-46,150 l-12,8 l4,-12 z"/><path d="M46,150 l12,8 l-4,-12 z"/></g>
  <path d="M-64,170 l-26,30" class="arrow" marker-end="url(#ah-tk)" style="stroke:#7fa3b5"/><path d="M64,170 l26,30" class="arrow" marker-end="url(#ah-tk)" style="stroke:#7fa3b5"/>
  <path d="M0,-6 L0,-26" class="ln-thin"/><text class="lbl-sm lbl-b" x="6" y="-14">single leader</text>
  <text class="lbl-sm" x="-110" y="262">sloping, flexible branches</text>
  <text class="lbl-sm" x="-110" y="276">bend and drop their snow</text>
</g>
<g transform="translate(700,170)">
  <ellipse cx="0" cy="40" rx="52" ry="34" fill="#9a9a7a"/>
  <path d="M-50,22 C-30,4 30,4 50,22 L46,12 C26,-6 -26,-6 -46,12 Z" class="f-snow" stroke="#b9c3c6"/>
  <rect x="-6" y="72" width="12" height="40" class="f-earth"/>
  <path d="M-20,30 L-28,46" class="ln-warn"/><path d="M18,28 l10,18" class="ln-warn"/>
  <text class="lbl-sm" x="0" y="130" text-anchor="middle">broad crown holds</text>
  <text class="lbl-sm" x="0" y="144" text-anchor="middle">snow → branches break</text>
</g>
</svg>
