<svg viewBox="0 0 640 250" role="img" aria-labelledby="dg-foot-t dg-foot-d" class="dg">
<title id="dg-foot-t">Foot-load of a lynx compared with a coyote</title>
<desc id="dg-foot-d">A lynx and a coyote have similar body mass, but the lynx's paw prints are much larger. Foot-load, body mass divided by foot area, is 4.1 to 8.8 times higher in the coyote, so the coyote sinks deeper into soft snow.</desc>
<g transform="translate(30,20)">
  <text class="lbl lbl-b" x="0" y="0">Lynx</text>
  <g transform="translate(70,48)" class="f-a2"><ellipse cx="0" cy="18" rx="30" ry="26"/><ellipse cx="-26" cy="-22" rx="11" ry="14"/><ellipse cx="-8" cy="-34" rx="11" ry="14"/><ellipse cx="12" cy="-34" rx="11" ry="14"/><ellipse cx="29" cy="-21" rx="11" ry="14"/></g>
  <text class="lbl-sm lbl-mute" x="0" y="110">big, furry paw = large area</text>
  <text class="lbl lbl-b" x="0" y="150">Coyote</text>
  <g transform="translate(58,178)" class="f-earth"><ellipse cx="0" cy="8" rx="13" ry="11"/><ellipse cx="-11" cy="-11" rx="5" ry="7"/><ellipse cx="-3" cy="-17" rx="5" ry="7"/><ellipse cx="6" cy="-17" rx="5" ry="7"/><ellipse cx="13" cy="-10" rx="5" ry="7"/></g>
  <text class="lbl-sm lbl-mute" x="0" y="212">similar body mass, small paw</text>
</g>
<g transform="translate(270,30)">
  <text class="lbl lbl-b" x="0" y="0">Foot-load = body mass ÷ foot area</text>
  <rect x="0" y="22" width="40" height="26" class="f-a2"/><text class="lbl" x="48" y="40">Lynx: 1×</text>
  <rect x="0" y="66" width="164" height="26" class="f-earth" opacity="0.45"/><rect x="0" y="66" width="164" height="26" class="ln-thin"/>
  <rect x="164" y="66" width="188" height="26" class="f-earth" opacity="0.85"/>
  <text class="lbl lbl-w lbl-b" x="172" y="84">4.1–8.8×</text>
  <text class="lbl" x="0" y="112">Coyote: 4.1 to 8.8 times more weight per unit of foot</text>
  <g transform="translate(0,140)">
    <rect x="0" y="0" width="340" height="56" class="f-snow" stroke="#b9c3c6"/>
    <rect x="60" y="0" width="34" height="14" class="f-a2"/><text class="lbl-sm" x="77" y="34" text-anchor="middle">lynx sinks less</text>
    <rect x="230" y="0" width="16" height="42" class="f-earth"/><text class="lbl-sm" x="238" y="54" text-anchor="middle">coyote sinks deeper</text>
    <text class="lbl-sm lbl-mute" x="0" y="-6">soft snow</text>
  </g>
</g>
</svg>
