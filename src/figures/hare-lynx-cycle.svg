<svg viewBox="0 0 640 230" role="img" aria-labelledby="dg-cyc-t dg-cyc-d" class="dg">
<title id="dg-cyc-t">Schematic hare and lynx population cycle</title>
<desc id="dg-cyc-d">Two wave-shaped curves over about 20 years. The snowshoe hare curve rises and falls roughly every 10 years. The lynx curve has the same rhythm but peaks one to two years after the hares.</desc>
<g transform="translate(60,20)">
  <path d="M0,170 H540" class="ln"/><path d="M0,0 V170" class="ln"/>
  <text class="lbl-sm lbl-mute" x="-8" y="10" text-anchor="end">high</text><text class="lbl-sm lbl-mute" x="-8" y="168" text-anchor="end">low</text>
  <g class="lbl-sm lbl-mute" text-anchor="middle"><text x="0" y="188">0</text><text x="135" y="188">5</text><text x="270" y="188">10</text><text x="405" y="188">15</text><text x="540" y="188">20 years</text></g>
  <path id="hare" d="M0,150 C40,150 70,10 110,10 C150,10 160,150 200,155 C230,158 250,150 270,150 C310,150 340,10 380,10 C420,10 430,150 470,155 C500,158 520,150 540,150" fill="none" stroke="#8a6a46" stroke-width="3"/>
  <path d="M0,160 C60,160 100,60 140,60 C180,60 190,158 230,162 C260,164 280,160 300,160 C340,160 370,60 410,60 C450,60 460,158 500,162 C520,164 530,162 540,162" fill="none" class="ln-a" stroke-width="3" stroke-dasharray="7 4"/>
  <text class="lbl lbl-b" x="112" y="0" text-anchor="middle" style="fill:#7a5a36">Hares peak</text>
  <text class="lbl lbl-b lbl-a" x="150" y="52">Lynx peak 1–2 yr later</text>
</g>
</svg>
