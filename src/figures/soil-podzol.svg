<svg viewBox="0 0 470 560" role="img" aria-labelledby="dg-soil-t dg-soil-d" class="dg">
<title id="dg-soil-t">Podzol (Spodosol) soil profile</title>
<desc id="dg-soil-d">A soil column with five horizons from top to bottom: O horizon of needles and organic matter, a thin dark A horizon, a pale ash-gray E horizon, a reddish-brown B horizon where iron, aluminum and humus accumulate, and a sandy C horizon of parent material. Arrows show acidic water carrying dissolved iron and aluminum complexes down from the E horizon and depositing them in the B horizon.</desc>
<defs><marker id="ah-soil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-ink"/></marker>
<pattern id="pebbles" width="28" height="22" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="3" fill="#b9a273"/><circle cx="19" cy="15" r="4" fill="#c4ad7f"/><circle cx="24" cy="4" r="2" fill="#a68f62"/></pattern></defs>
<g transform="translate(30,20)">
  <path d="M8,22 l10,-14 l6,10 l9,-12 l7,13 l10,-10 l5,12 l12,-13 l6,11 l11,-9 l8,12 l10,-11 l4,11" fill="none" stroke="#3f5a3a" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="0" y="22" width="130" height="62" fill="#3b2a1e"/>
  <rect x="0" y="84" width="130" height="20" fill="#4f3b2b"/>
  <rect x="0" y="104" width="130" height="112" fill="#d6d1c6"/>
  <rect x="0" y="216" width="130" height="38" fill="#5c3b25"/>
  <rect x="0" y="254" width="130" height="118" fill="#a35f2f"/>
  <rect x="0" y="372" width="130" height="148" fill="#dcc89d"/>
  <rect x="0" y="372" width="130" height="148" fill="url(#pebbles)"/>
  <rect x="0" y="22" width="130" height="498" class="ln"/>
  <g class="lbl-b" style="font-size:20px">
    <text x="-10" y="58" text-anchor="end">O</text><text x="-10" y="99" text-anchor="end">A</text><text x="-10" y="165" text-anchor="end">E</text><text x="-10" y="240" text-anchor="end">Bh</text><text x="-10" y="318" text-anchor="end">Bs</text><text x="-10" y="452" text-anchor="end">C</text>
  </g>
  <path d="M65,120 V200" class="arrow" marker-end="url(#ah-soil)" style="stroke:#7a3b17;stroke-width:2.4"/>
  <path d="M35,130 V196" class="arrow" marker-end="url(#ah-soil)" style="stroke:#7a3b17;stroke-width:1.6"/>
  <path d="M95,130 V196" class="arrow" marker-end="url(#ah-soil)" style="stroke:#7a3b17;stroke-width:1.6"/>
  <g transform="translate(150,0)">
    <path d="M0,52 H14" class="ln-thin"/><text class="lbl lbl-b" x="20" y="47">O: litter and organic mat</text><text class="lbl-sm lbl-mute" x="20" y="63">needles, moss, slowly decaying</text><text class="lbl-sm lbl-mute" x="20" y="77">→ acidic organic compounds</text>
    <path d="M0,95 H14" class="ln-thin"/><text class="lbl lbl-b" x="20" y="99">A: thin dark mineral layer</text>
    <path d="M0,150 H14" class="ln-thin"/><text class="lbl lbl-b" x="20" y="140">E: bleached, ash-gray</text><text class="lbl-sm lbl-mute" x="20" y="156">acids dissolve Fe and Al;</text><text class="lbl-sm lbl-mute" x="20" y="170">metal–organic complexes leach</text><text class="lbl-sm lbl-mute" x="20" y="184">downward (eluviation)</text>
    <path d="M0,240 H14" class="ln-thin"/><text class="lbl lbl-b" x="20" y="236">Bh: humus deposited</text><text class="lbl-sm lbl-mute" x="20" y="252">dark, organic-rich</text>
    <path d="M0,310 H14" class="ln-thin"/><text class="lbl lbl-b" x="20" y="300">Bs / Bf: iron and aluminum</text><text class="lbl-sm lbl-mute" x="20" y="316">reddish-brown accumulation</text><text class="lbl-sm lbl-mute" x="20" y="330">(illuviation); may cement into</text><text class="lbl-sm lbl-mute" x="20" y="344">a hard layer roots can’t pass</text>
    <path d="M0,440 H14" class="ln-thin"/><text class="lbl lbl-b" x="20" y="436">C: parent material</text><text class="lbl-sm lbl-mute" x="20" y="452">sandy glacial sediment,</text><text class="lbl-sm lbl-mute" x="20" y="466">acidic igneous minerals</text>
  </g>
  <text class="lbl-sm lbl-a lbl-b" x="65" y="540" text-anchor="middle">water drains downward ↓</text>
</g>
</svg>
