<svg viewBox="0 0 700 330" role="img" aria-labelledby="dg-fb-t dg-fb-d" class="dg">
<title id="dg-fb-t">A fiddler crab burrow at low tide and high tide</title>
<desc id="dg-fb-d">Two side-by-side cross-sections of marsh mud with a cordgrass plant. Left, low tide: the mud surface is exposed, the burrow entrance is open, and the crab is outside feeding on detritus and leaving small pellets of cleaned mud. Right, high tide: water covers the marsh, the crab shelters at the bottom of its burrow, and the entrance is sealed with a mud plug. The burrow runs about 30 to 90 centimeters down beside the grass roots, which support its walls.</desc>
<g>
  <text class="lbl lbl-b" x="170" y="24" text-anchor="middle">Low tide: out feeding</text>
  <text class="lbl lbl-b" x="530" y="24" text-anchor="middle">High tide: sealed inside</text>
  <path d="M350,14 V320" class="ln-dash"/>
</g>
<!-- LEFT panel -->
<g>
  <rect x="10" y="110" width="320" height="210" fill="#6b523d"/>
  <path d="M10,110 H330" stroke="#b07a45" stroke-width="5"/>
  <!-- cordgrass -->
  <g stroke="#4d7a3e" stroke-width="3" stroke-linecap="round"><path d="M70,110 l-4,-64 M78,110 l5,-70 M86,110 l-2,-58"/></g>
  <g stroke="#c4a27a" stroke-width="2" fill="none"><path d="M78,112 c-6,30 -14,60 -10,100 M78,112 c8,26 16,52 12,84 M78,118 c-14,10 -24,18 -34,22"/></g>
  <!-- burrow -->
  <path d="M170,110 C170,150 160,190 168,230 C172,252 190,262 210,262 C226,262 236,252 236,240" fill="none" stroke="#3a2a1d" stroke-width="20" stroke-linecap="round"/>
  <!-- crab outside -->
  <g transform="translate(232,96)">
    <ellipse cx="0" cy="0" rx="18" ry="11" fill="#3b4a52"/>
    <path d="M14,-4 C30,-18 44,-12 40,0 C36,8 24,4 16,2 Z" fill="#e8dcc2" stroke="#5a4330" stroke-width="1"/>
    <path d="M-14,4 l-10,10 M-8,8 l-6,12 M4,9 l4,12 M10,8 l10,10" stroke="#3b4a52" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="-6" cy="-12" r="2.4" fill="#3b4a52"/><circle cx="4" cy="-12" r="2.4" fill="#3b4a52"/>
  </g>
  <!-- pellets -->
  <g fill="#c9a77c"><circle cx="270" cy="106" r="3"/><circle cx="280" cy="105" r="3"/><circle cx="289" cy="107" r="3"/><circle cx="262" cy="104" r="2.6"/></g>
  <text class="lbl-sm" x="300" y="62" text-anchor="end">feeds on detritus,</text>
  <text class="lbl-sm" x="300" y="78" text-anchor="end">spits out mud pellets</text>
  <text class="lbl-sm lbl-w" x="186" y="300">burrow 30 to 90 cm deep</text>
  <text class="lbl-sm lbl-w" x="20" y="300">roots support walls</text>
</g>
<!-- RIGHT panel -->
<g>
  <rect x="370" y="44" width="320" height="66" fill="#a8c9bd" opacity="0.55"/>
  <path d="M370,44 H690" class="ln-thin"/>
  <text class="lbl-sm lbl-mute" x="684" y="62" text-anchor="end">tide water covers the marsh</text>
  <rect x="370" y="110" width="320" height="210" fill="#6b523d"/>
  <path d="M370,110 H690" stroke="#b07a45" stroke-width="5"/>
  <g stroke="#4d7a3e" stroke-width="3" stroke-linecap="round"><path d="M430,110 l-4,-64 M438,110 l5,-70 M446,110 l-2,-58"/></g>
  <g stroke="#c4a27a" stroke-width="2" fill="none"><path d="M438,112 c-6,30 -14,60 -10,100 M438,112 c8,26 16,52 12,84 M438,118 c-14,10 -24,18 -34,22"/></g>
  <path d="M530,126 C530,160 520,196 528,230 C532,252 550,262 570,262 C586,262 596,252 596,240" fill="none" stroke="#3a2a1d" stroke-width="20" stroke-linecap="round"/>
  <!-- mud plug -->
  <rect x="519" y="106" width="22" height="22" rx="4" fill="#8a6a49" stroke="#3a2a1d" stroke-width="1.5"/>
  <!-- crab inside chamber -->
  <g transform="translate(572,258) scale(0.55)">
    <ellipse cx="0" cy="0" rx="18" ry="11" fill="#3b4a52"/>
    <path d="M14,-4 C30,-18 44,-12 40,0 C36,8 24,4 16,2 Z" fill="#e8dcc2" stroke="#5a4330" stroke-width="1"/>
  </g>
  <path d="M545,118 L600,92" class="ln-thin"/>
  <text class="lbl-sm lbl-b" x="604" y="90">mud plug</text>
  <text class="lbl-sm lbl-w" x="540" y="300" text-anchor="middle">crab shelters below the sealed entrance</text>
</g>
</svg>
