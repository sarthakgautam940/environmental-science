<svg viewBox="0 0 700 260" role="img" aria-labelledby="dg-molt-t dg-molt-d" class="dg">
<title id="dg-molt-t">Snowshoe hare coat color and snow cover through the year</title>
<desc id="dg-molt-d">A timeline from August to July. The hare's coat turns white in fall and brown in spring on a schedule set mainly by day length. In a typical year, snow cover roughly overlaps the white-coat period. With a warmer climate, snow arrives later and melts earlier, leaving weeks in fall and spring when a white hare sits on bare brown ground: a camouflage mismatch.</desc>
<g transform="translate(150,30)">
  <g class="lbl-sm lbl-mute" text-anchor="middle"><text x="20" y="0">Aug</text><text x="60" y="0">Sep</text><text x="100" y="0">Oct</text><text x="140" y="0">Nov</text><text x="180" y="0">Dec</text><text x="220" y="0">Jan</text><text x="260" y="0">Feb</text><text x="300" y="0">Mar</text><text x="340" y="0">Apr</text><text x="380" y="0">May</text><text x="420" y="0">Jun</text><text x="460" y="0">Jul</text></g>
  <defs><linearGradient id="g-coat" x1="0" x2="1"><stop offset="0" stop-color="#8a6a46"/><stop offset="0.17" stop-color="#8a6a46"/><stop offset="0.27" stop-color="#f4f4f2"/><stop offset="0.66" stop-color="#f4f4f2"/><stop offset="0.76" stop-color="#8a6a46"/><stop offset="1" stop-color="#8a6a46"/></linearGradient></defs>
  <rect x="0" y="14" width="480" height="34" fill="url(#g-coat)" stroke="#9aa3a0"/>
  <text class="lbl lbl-b" x="-12" y="36" text-anchor="end">Hare coat</text>
  <text class="lbl-sm lbl-mute" x="-12" y="50" text-anchor="end">timed by day length</text>
  <rect x="120" y="64" width="232" height="26" fill="#dfe9ee" stroke="#9fb6c2"/>
  <text class="lbl lbl-b" x="-12" y="82" text-anchor="end">Snow (typical year)</text>
  <rect x="160" y="106" width="152" height="26" fill="#dfe9ee" stroke="#9fb6c2"/>
  <rect x="104" y="106" width="56" height="26" class="f-warn" opacity="0.3"/><rect x="312" y="106" width="52" height="26" class="f-warn" opacity="0.3"/>
  <text class="lbl lbl-b" x="-12" y="124" text-anchor="end">Snow (warmer future)</text>
  <text class="lbl-sm lbl-warn lbl-b" x="132" y="150" text-anchor="middle">mismatch</text>
  <text class="lbl-sm lbl-warn lbl-b" x="338" y="150" text-anchor="middle">mismatch</text>
  <text class="lbl-sm" x="0" y="180">White hare on brown ground is easier for predators to spot.</text>
  <text class="lbl-sm" x="0" y="197">Models project 4 to 8 times more mismatch days by 2100.</text>
  <text class="lbl-sm lbl-mute" x="0" y="216">Schematic, not data: molt and snow dates vary by place and year.</text>
</g>
</svg>
