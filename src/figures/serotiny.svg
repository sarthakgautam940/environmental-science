<svg viewBox="0 0 640 210" role="img" aria-labelledby="dg-sero-t dg-sero-d" class="dg">
<title id="dg-sero-t">How a serotinous cone works</title>
<desc id="dg-sero-d">Left: a closed pine cone with scales sealed by resin, stored on the tree for years. Middle: fire heats the cone to about 45 to 50 degrees Celsius, melting the resin. Right: the cone scales open and seeds fall onto bare, sunny, burned mineral soil.</desc>
<defs><marker id="ah-sero" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" class="f-ink"/></marker></defs>
<g transform="translate(70,30)">
  <ellipse cx="0" cy="60" rx="28" ry="52" class="f-earth"/>
  <g fill="none" stroke="#3a2a1d" stroke-width="1.4"><path d="M-26,40 Q0,52 26,40"/><path d="M-28,60 Q0,72 28,60"/><path d="M-26,80 Q0,92 26,80"/><path d="M-20,98 Q0,108 20,98"/><path d="M-20,22 Q0,32 20,22"/></g>
  <g fill="#e8c55a"><circle cx="-14" cy="48" r="3"/><circle cx="10" cy="66" r="3"/><circle cx="-6" cy="86" r="3"/><circle cx="14" cy="30" r="3"/></g>
  <text class="lbl lbl-b" x="0" y="140" text-anchor="middle">Sealed cone</text>
  <text class="lbl-sm lbl-mute" x="0" y="156" text-anchor="middle">resin glues scales shut;</text>
  <text class="lbl-sm lbl-mute" x="0" y="170" text-anchor="middle">seeds stored for years</text>
</g>
<path d="M130,90 H230" class="arrow" marker-end="url(#ah-sero)"/>
<g transform="translate(300,40)">
  <path d="M0,90 C-30,60 -10,40 -4,10 C10,35 30,40 14,10 C40,40 40,70 22,92 Z" class="f-warn" opacity="0.85"/>
  <path d="M4,90 C-8,72 2,60 6,44 C14,62 22,66 16,90 Z" fill="#e8b04a"/>
  <text class="lbl lbl-b" x="10" y="128" text-anchor="middle">Fire heat</text>
  <text class="lbl-sm lbl-mute" x="10" y="144" text-anchor="middle">45–50 °C (113–120 °F)</text>
  <text class="lbl-sm lbl-mute" x="10" y="158" text-anchor="middle">melts the resin</text>
</g>
<path d="M360,90 H460" class="arrow" marker-end="url(#ah-sero)"/>
<g transform="translate(540,22)">
  <path d="M0,10 L-34,34 L-8,40 L-40,62 L-8,66 L-36,92 L0,92 L36,92 L8,66 L40,62 L8,40 L34,34 Z" class="f-earth"/>
  <g class="f-ink"><ellipse cx="-30" cy="112" rx="3" ry="2"/><ellipse cx="-12" cy="122" rx="3" ry="2"/><ellipse cx="10" cy="116" rx="3" ry="2"/><ellipse cx="28" cy="126" rx="3" ry="2"/></g>
  <rect x="-70" y="134" width="140" height="10" fill="#cdbb95"/>
  <text class="lbl lbl-b" x="0" y="162" text-anchor="middle">Seeds released</text>
  <text class="lbl-sm lbl-mute" x="0" y="178" text-anchor="middle">onto sunny, bare mineral soil</text>
</g>
</svg>
