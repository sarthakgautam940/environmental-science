<svg viewBox="0 0 860 330" role="img" aria-labelledby="dg-ls-t dg-ls-d" class="dg">
<title id="dg-ls-t">Hardened shoreline compared with a living shoreline</title>
<desc id="dg-ls-d">Two cross-sections. Left, a bulkhead: a vertical concrete or wooden wall at the water's edge with deep water in front, no marsh and no shallow habitat; hardening like this can speed up erosion and the loss of nearby beaches and tidal wetlands. Right, a living shoreline: a gentle slope planted with marsh grasses, with a low rock sill or oyster reef offshore. Waves lose energy over the sill and the marsh, sediment settles behind them, roots hold the soil, and the marsh and reef provide habitat for fish, crabs and oysters.</desc>
<defs><marker id="ah-ls" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d3b53"/></marker></defs>
<g class="lbl lbl-b">
  <text x="200" y="24" text-anchor="middle">Hardened: bulkhead or seawall</text>
  <text x="640" y="24" text-anchor="middle">Living shoreline</text>
</g>
<path d="M425,12 V320" class="ln-dash"/>
<!-- LEFT -->
<g>
  <path d="M10,90 H150 V300 H10 Z" fill="#8b7350"/>
  <rect x="150" y="80" width="16" height="220" fill="#8c8c8c"/>
  <path d="M166,150 H410 V300 H166 Z" fill="#5f8f93" opacity="0.8"/>
  <path d="M166,150 c14,-8 28,-8 42,0 c14,8 28,8 42,0 c14,-8 28,-8 42,0 c14,8 28,8 42,0 c14,-8 28,-8 42,0 c14,8 22,8 34,0" class="ln-thin" style="stroke:#1d3b53"/>
  <path d="M166,300 C220,296 260,286 300,290 C340,294 380,298 410,298 V320 H10 V300 Z" fill="#6b523d"/>
  <path d="M175,290 C190,280 200,282 214,296" fill="none" stroke="#9a4a2c" stroke-width="2.4"/>
  <path d="M320,170 H190" class="arrow" style="stroke:#1d3b53;stroke-width:2.4" marker-end="url(#ah-ls)"/>
  <text class="lbl-sm lbl-w lbl-b" x="230" y="200">waves hit the wall</text>
  <text class="lbl-sm lbl-w lbl-b" x="186" y="266">hardening can speed erosion</text>
  <text class="lbl-sm lbl-w" x="186" y="282">of nearby beaches and marshes</text>
  <text class="lbl-sm" x="20" y="60">no marsh, no shallows:</text>
  <text class="lbl-sm" x="20" y="76">little habitat for wildlife</text>
</g>
<!-- RIGHT -->
<g>
  <path d="M440,100 H520 C560,110 600,130 640,150 C680,166 720,180 760,190 L850,196 V300 H440 Z" fill="#8b7350"/>
  <path d="M600,150 H850 V300 H600 Z" fill="#5f8f93" opacity="0.8" style="mix-blend-mode:normal"/>
  <path d="M520,100 C560,110 600,130 640,150 C680,166 720,180 760,190 L850,196 V320 H440 V100 Z" fill="#6b523d"/>
  <path d="M440,100 H520" stroke="#6b523d" stroke-width="2"/>
  <!-- water drawn over slope where submerged -->
  <path d="M640,150 C680,166 720,180 760,190 L850,196 V150 Z" fill="#5f8f93" opacity="0.85"/>
  <!-- marsh grass -->
  <g stroke="#4d7a3e" stroke-width="2.4" stroke-linecap="round">
    <path d="M530,104 l-3,-26 M540,108 l3,-30 M550,112 l-3,-28 M560,116 l3,-30 M572,121 l-3,-30 M584,126 l3,-32 M596,131 l-3,-30 M608,137 l3,-34 M620,142 l-3,-32 M632,147 l3,-34"/>
  </g>
  <g stroke="#c4a27a" stroke-width="1.4" fill="none" opacity="0.8"><path d="M540,110 v26 M560,118 v28 M584,128 v30 M608,140 v28"/></g>
  <!-- sill / oyster reef -->
  <path d="M730,188 l10,-24 l14,-6 l14,6 l10,24 z" fill="#9d9488" stroke="#5a5a5a"/>
  <g fill="#cfc6b4" stroke="#5a4330" stroke-width="0.8"><ellipse cx="742" cy="168" rx="6" ry="3"/><ellipse cx="760" cy="164" rx="6" ry="3"/><ellipse cx="770" cy="176" rx="6" ry="3"/></g>
  <!-- waves -->
  <path d="M850,150 c-10,-6 -20,-6 -30,0 c-10,6 -20,6 -30,0 c-8,-4 -14,-4 -20,0" class="ln-thin" style="stroke:#1d3b53"/>
  <path d="M720,150 c-8,-3 -14,-3 -20,0 c-8,3 -14,3 -20,0" class="ln-thin" style="stroke:#1d3b53;opacity:.6"/>
  <path d="M840,166 H790" class="arrow" style="stroke:#1d3b53;stroke-width:2.4" marker-end="url(#ah-ls)"/>
  <path d="M720,166 H690" class="arrow" style="stroke:#1d3b53;stroke-width:1.2" marker-end="url(#ah-ls)"/>
  <text class="lbl-sm lbl-b" x="760" y="60" text-anchor="middle">rock sill or</text>
  <text class="lbl-sm lbl-b" x="760" y="76" text-anchor="middle">oyster reef</text>
  <path d="M760,82 V156" class="ln-thin"/>
  <text class="lbl-sm lbl-b" x="580" y="50" text-anchor="middle">marsh plants</text>
  <text class="lbl-sm" x="580" y="66" text-anchor="middle">roots hold soil</text>
  <text class="lbl-sm lbl-w lbl-b" x="650" y="250">waves lose energy over the</text>
  <text class="lbl-sm lbl-w lbl-b" x="650" y="266">sill and marsh; sediment settles;</text>
  <text class="lbl-sm lbl-w lbl-b" x="650" y="282">habitat for fish, crabs, oysters</text>
</g>
</svg>
