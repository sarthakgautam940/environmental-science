<svg viewBox="0 0 880 420" role="img" aria-labelledby="dg-ms-t dg-ms-d" class="dg">
<title id="dg-ms-t">Cross-section of a salt marsh from upland to channel</title>
<desc id="dg-ms-d">From left to right: upland forest rarely flooded; high marsh with short salt hay and glasswort, flooded only by the highest tides about twice a month; low marsh with tall smooth cordgrass flooded every day; a mudflat exposed at low tide; and a subtidal channel with eelgrass. Dashed lines mark mean high tide, spring high tide and low tide. Underground, a thick layer of root-filled peat lies under the marsh. Only a thin surface layer of sediment are brown and oxygenated; below that the sediment is gray-black, oxygen-free and smells of hydrogen sulfide.</desc>
<!-- tide lines -->
<g>
  <path d="M120,118 H860" class="ln-dash"/>
  <path d="M300,150 H860" class="ln-dash"/>
  <path d="M600,232 H860" class="ln-dash"/>
  <text class="lbl-sm lbl-mute" x="864" y="114" text-anchor="end">spring high tide (new and full moon)</text>
  <text class="lbl-sm lbl-mute" x="864" y="146" text-anchor="end">average high tide</text>
  <text class="lbl-sm lbl-mute" x="864" y="228" text-anchor="end">low tide</text>
</g>
<!-- water at high tide (light) -->
<path d="M300,150 L860,150 L860,330 L600,330 Z" fill="#a8c9bd" opacity="0.35"/>
<!-- ground profile -->
<path d="M0,96 C60,92 100,96 140,104 C180,112 220,124 260,134 C300,142 340,152 400,160 C440,164 480,168 520,176 C560,196 600,240 640,262 C680,280 720,286 760,300 L860,312 L860,410 L0,410 Z" fill="#6b523d"/>
<!-- oxygen-free sediment below the thin surface layer, under marsh and mudflat -->
<path d="M140,104 C180,112 220,124 260,134 C300,142 340,152 400,160 C440,164 480,168 520,176 C560,196 600,240 640,262 C680,280 720,286 760,300 L860,312 L860,410 L70,410 Z" fill="#3a3d3c"/>
<!-- peat layer -->
<path d="M150,110 C200,124 240,134 300,146 C350,156 420,164 500,174 C540,184 560,202 576,220 C560,250 500,268 420,270 C330,268 240,250 180,226 C160,214 150,190 150,110 Z" fill="#2a1f17"/>
<!-- thin oxidized layer -->
<path d="M140,104 C180,112 220,124 260,134 C300,142 340,152 400,160 C440,164 480,168 520,176 C560,196 600,240 640,262 C680,280 720,286 760,300 L860,312" fill="none" stroke="#b07a45" stroke-width="5"/>
<!-- upland trees -->
<g fill="#2e5a46">
  <path d="M30,94 l14,-46 l14,46 z"/><path d="M62,94 l12,-38 l12,38 z"/><path d="M94,98 l13,-42 l13,42 z"/>
</g>
<!-- high marsh short grass -->
<g stroke="#8a9a5b" stroke-width="2" stroke-linecap="round">
  <path d="M160,110 l-3,-14 M166,112 l2,-15 M172,114 l-2,-13 M180,116 l3,-15 M188,118 l-2,-14 M196,120 l2,-15 M204,122 l-3,-13 M212,124 l2,-14 M222,126 l-2,-14 M232,128 l3,-14 M242,131 l-2,-14 M252,133 l2,-13"/>
</g>
<!-- glasswort (succulent, reddish) -->
<g fill="#a5523b"><rect x="268" y="124" width="4" height="12" rx="2"/><rect x="276" y="122" width="4" height="15" rx="2"/><rect x="284" y="126" width="4" height="12" rx="2"/></g>
<!-- low marsh tall cordgrass -->
<g stroke="#4d7a3e" stroke-width="2.4" stroke-linecap="round">
  <path d="M320,148 l-5,-46 M330,150 l4,-52 M340,151 l-3,-48 M350,153 l5,-54 M360,154 l-4,-50 M370,156 l3,-55 M380,157 l-5,-50 M390,158 l4,-54 M400,160 l-3,-50 M412,161 l5,-55 M424,162 l-4,-50 M436,164 l3,-54 M448,165 l-5,-50 M460,166 l4,-55 M472,168 l-3,-50 M484,170 l4,-52 M496,172 l-4,-48 M508,174 l3,-46"/>
</g>
<!-- roots in peat -->
<g class="ln-thin" style="stroke:#c4a27a;opacity:.7">
  <path d="M330,152 v40 M350,155 v46 M370,158 v44 M390,160 v40 M412,163 v44 M436,166 v40 M460,168 v44 M484,172 v38"/>
</g>
<!-- eelgrass in channel -->
<g stroke="#5f8f5a" stroke-width="2" fill="none" stroke-linecap="round">
  <path d="M780,302 c-4,-20 4,-34 -2,-52 M790,303 c3,-18 -4,-32 2,-50 M800,305 c-4,-18 4,-30 -1,-46 M812,306 c3,-16 -3,-30 1,-44"/>
</g>
<!-- zone labels -->
<g class="lbl lbl-b">
  <text x="66" y="30" text-anchor="middle">Upland</text>
  <text x="215" y="30" text-anchor="middle">High marsh</text>
  <text x="420" y="30" text-anchor="middle">Low marsh</text>
  <text x="640" y="30" text-anchor="middle">Mudflat</text>
  <text x="790" y="30" text-anchor="middle">Channel</text>
</g>
<g class="lbl-sm lbl-mute">
  <text x="66" y="47" text-anchor="middle">rarely flooded</text>
  <text x="215" y="47" text-anchor="middle">flooded about twice</text><text x="215" y="62" text-anchor="middle">a month; salt hay,</text><text x="215" y="77" text-anchor="middle">glasswort</text>
  <text x="420" y="47" text-anchor="middle">flooded every day;</text><text x="420" y="62" text-anchor="middle">tall smooth cordgrass</text>
  <text x="640" y="47" text-anchor="middle">bare at low tide;</text><text x="640" y="62" text-anchor="middle">crabs, worms, clams</text>
  <text x="790" y="47" text-anchor="middle">always underwater;</text><text x="790" y="62" text-anchor="middle">eelgrass, oysters</text>
</g>
<!-- underground labels -->
<g>
  <text class="lbl lbl-w lbl-b" x="360" y="214" text-anchor="middle">Peat: roots and partly decayed</text>
  <text class="lbl lbl-w lbl-b" x="360" y="232" text-anchor="middle">plant matter, waterlogged</text>
  <text class="lbl lbl-w lbl-b" x="740" y="352" text-anchor="middle">Gray-black, oxygen-free mud</text>
  <text class="lbl-sm lbl-w" x="740" y="370" text-anchor="middle">bacteria make hydrogen sulfide</text>
  <text class="lbl-sm lbl-w" x="740" y="386" text-anchor="middle">(rotten-egg smell)</text>
  <path d="M630,256 L590,300" class="ln-thin" style="stroke:#fff"/>
  <text class="lbl-sm lbl-w lbl-b" x="586" y="314" text-anchor="end">thin brown oxygenated</text>
  <text class="lbl-sm lbl-w lbl-b" x="586" y="330" text-anchor="end">surface layer</text>
</g>
<text class="lbl-sm lbl-w" x="330" y="330" text-anchor="middle">Under both marsh and mudflat, everything below</text>
<text class="lbl-sm lbl-w" x="330" y="346" text-anchor="middle">the thin surface layer is waterlogged and oxygen-poor.</text>
</svg>
