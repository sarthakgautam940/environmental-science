<svg viewBox="0 0 640 470" role="img" aria-labelledby="dg-cg-t dg-cg-d" class="dg">
<title id="dg-cg-t">How smooth cordgrass handles salt and lack of oxygen</title>
<desc id="dg-cg-d">A cordgrass plant standing in tidal water with its roots in dark mud. Labels show: salt crystals on the leaf surface where salt glands secrete excess salt; air entering the leaves and stems and moving down through spongy aerenchyma tissue to the roots; oxygen leaking from the roots into a thin oxidized zone around each root; root membranes that filter out much of the salt from seawater; and long hollow rhizomes that spread the plant sideways and anchor the mud.</desc>
<defs>
<marker id="ah-cg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d3b53"/></marker>
</defs>
<!-- water -->
<rect x="0" y="200" width="640" height="70" fill="#a8c9bd" opacity="0.45"/>
<path d="M0,200 H640" class="ln-thin"/>
<text class="lbl-sm lbl-mute" x="10" y="194">high tide</text>
<!-- mud -->
<rect x="0" y="270" width="640" height="200" fill="#3a3d3c"/>
<path d="M0,270 H640" stroke="#b07a45" stroke-width="5"/>
<!-- plant: stem and leaves -->
<g stroke="#4d7a3e" stroke-linecap="round" fill="none">
  <path d="M250,270 C248,210 250,140 254,60" stroke-width="9"/>
  <path d="M252,200 C220,170 196,150 170,140" stroke-width="5"/>
  <path d="M252,160 C280,120 300,104 330,96" stroke-width="5"/>
  <path d="M253,120 C232,92 220,76 204,62" stroke-width="5"/>
  <path d="M254,90 C268,62 276,48 290,36" stroke-width="4.5"/>
</g>
<!-- aerenchyma inside stem -->
<g fill="#ffffff" opacity="0.9">
  <circle cx="251" cy="250" r="2"/><circle cx="250" cy="226" r="2"/><circle cx="250" cy="200" r="2"/><circle cx="251" cy="174" r="2"/><circle cx="252" cy="148" r="2"/><circle cx="252" cy="122" r="2"/><circle cx="253" cy="96" r="2"/>
</g>
<!-- salt crystals on leaves -->
<g fill="#ffffff" stroke="#5f6964" stroke-width="0.8">
  <rect x="300" y="98" width="6" height="6" transform="rotate(20 303 101)"/><rect x="314" y="94" width="5" height="5" transform="rotate(-15 316 96)"/><rect x="186" y="140" width="6" height="6" transform="rotate(10 189 143)"/><rect x="214" y="70" width="5" height="5"/>
</g>
<!-- roots -->
<g stroke="#c4a27a" stroke-width="3" fill="none" stroke-linecap="round">
  <path d="M250,270 C246,310 236,350 222,400"/><path d="M250,270 C258,320 268,360 282,410"/><path d="M250,280 C230,300 210,320 190,330"/><path d="M250,282 C272,300 292,318 312,326"/>
</g>
<!-- oxidized zone around roots -->
<g fill="none" stroke="#b07a45" stroke-width="7" opacity="0.55" stroke-linecap="round">
  <path d="M250,270 C246,310 236,350 222,400"/><path d="M250,270 C258,320 268,360 282,410"/>
</g>
<!-- rhizome -->
<path d="M60,300 C150,292 200,290 250,290 C340,290 470,296 600,302" stroke="#d6bf96" stroke-width="7" fill="none" stroke-linecap="round"/>
<path d="M480,298 C482,270 484,250 486,232 M560,301 C561,276 562,258 563,240" stroke="#4d7a3e" stroke-width="5" stroke-linecap="round" fill="none"/>
<!-- air arrow -->
<path d="M246,52 C240,120 238,190 240,262" class="arrow" style="stroke:#1d3b53;stroke-width:2" marker-end="url(#ah-cg)"/>
<!-- labels -->
<g>
  <path d="M318,96 L392,74" class="ln-thin"/>
  <text class="lbl lbl-b" x="398" y="64">Salt glands</text>
  <text class="lbl-sm lbl-mute" x="398" y="80">push excess salt out onto</text>
  <text class="lbl-sm lbl-mute" x="398" y="95">the leaf, where it dries</text>
  <text class="lbl-sm lbl-mute" x="398" y="110">to crystals</text>
</g>
<g>
  <path d="M236,150 L130,96" class="ln-thin"/>
  <text class="lbl lbl-b" x="10" y="44">Aerenchyma</text>
  <text class="lbl-sm lbl-mute" x="10" y="60">spongy air channels carry</text>
  <text class="lbl-sm lbl-mute" x="10" y="75">oxygen from leaves and</text>
  <text class="lbl-sm lbl-mute" x="10" y="90">stems down to the roots</text>
</g>
<g>
  <path d="M284,400 L330,420" class="ln-thin" style="stroke:#fff"/>
  <text class="lbl lbl-w lbl-b" x="336" y="420">Oxygen leaks from roots</text>
  <text class="lbl-sm lbl-w" x="336" y="436">and rusts a thin brown zone</text>
  <text class="lbl-sm lbl-w" x="336" y="451">in otherwise airless mud</text>
</g>
<g>
  <path d="M192,330 L130,360" class="ln-thin" style="stroke:#fff"/>
  <text class="lbl lbl-w lbl-b" x="10" y="376">Root filters</text>
  <text class="lbl-sm lbl-w" x="10" y="392">membranes keep out</text>
  <text class="lbl-sm lbl-w" x="10" y="407">much of the salt</text>
</g>
<g>
  <text class="lbl lbl-w lbl-b" x="430" y="340">Hollow rhizomes</text>
  <text class="lbl-sm lbl-w" x="430" y="356">spread new shoots sideways</text>
  <text class="lbl-sm lbl-w" x="430" y="371">and bind the mud</text>
  <path d="M420,334 L400,300" class="ln-thin" style="stroke:#fff"/>
</g>
</svg>
